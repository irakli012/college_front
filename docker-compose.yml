services:
  dev-env:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000" # Maps the Vite frontend
      - "5000:5000" # Maps the Express backend
    volumes:
      # Maps your local code to the container so edits happen instantly
      - .:/app
      # Prevents the container from overwriting its own node_modules with your local ones
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Ensures Vite file-watching works across Windows/Docker
      - VITE_PORT=3000
    env_file:
      - .env.local
