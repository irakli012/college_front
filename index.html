
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Ilia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://images.unsplash.com">
  <!-- Preload the main hero image to make the page feel faster -->
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&q=80&w=1600">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Noto+Sans:wght@100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
  <script>
    // 1. Theme initialization
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();

    // 2. Icon Font Guard - perfectly hides the "text" names of icons
    if ("fonts" in document) {
      document.fonts.load('24px "Material Symbols Outlined"').then(function() {
        document.documentElement.classList.add('fonts-loaded');
      });
    } else {
      // Fallback for older browsers
      setTimeout(() => document.documentElement.classList.add('fonts-loaded'), 1000);
    }
  </script>
<link rel="stylesheet" href="/src/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
