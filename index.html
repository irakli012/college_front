
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- College logo as browser tab and home-screen icon -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <title>ილია ჭავჭავაძის საზოგადოებრივი კოლეჯი</title>
  <meta name="description" content="ილია ჭავჭავაძის სახელობის ქ. საგარეჯოს საზოგადოებრივი კოლეჯი — ისიამოვნე სწავლით, დასაქმდი წარმატებით." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ილია ჭავჭავაძის საზოგადოებრივი კოლეჯი" />
  <meta property="og:description" content="ილია ჭავჭავაძის სახელობის ქ. საგარეჯოს საზოგადოებრივი კოლეჯი — ისიამოვნე სწავლით, დასაქმდი წარმატებით." />
  <meta property="og:image" content="https://college-website-assets.s3.eu-north-1.amazonaws.com/college+pics/CollegeNewWebsiteMandatory/collegeLogo_1_30.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://college-website-assets.s3.eu-north-1.amazonaws.com">
  <!-- Preload the main hero image to make the page feel faster -->
  <link rel="preload" as="image" type="image/webp" href="https://college-website-assets.s3.eu-north-1.amazonaws.com/site/home/hero-building.webp">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Noto+Sans:wght@100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
  <script>
    // 1. Theme initialization
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();

    // 2. Icon Font Guard - perfectly hides the "text" names of icons
    if ("fonts" in document) {
      document.fonts.load('24px "Material Symbols Outlined"').then(function() {
        document.documentElement.classList.add('fonts-loaded');
      });
    } else {
      // Fallback for older browsers
      setTimeout(() => document.documentElement.classList.add('fonts-loaded'), 1000);
    }
  </script>
<link rel="stylesheet" href="/src/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
